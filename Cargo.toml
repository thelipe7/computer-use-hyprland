[package]
name = "computer-use-hyprland"
version = "0.1.0"
publish = false
edition = "2024"
# The floor is the toolchain `rust-toolchain.toml` pins, because that is the
# only compiler anything here is built or tested with. A lower number would
# be a claim nothing checks.
rust-version = "1.98.1"
license = "MIT"
description = "Hyprland desktop control over MCP: AT-SPI accessibility tree, hyprctl window targeting, portal screenshots, and uinput input synthesis."
repository = "https://github.com/thelipe7/computer-use-hyprland"
readme = "README.md"
keywords = ["mcp", "hyprland", "wayland", "accessibility", "automation"]
categories = ["os::linux-apis", "command-line-utilities", "accessibility"]
# What a published tarball does not need: the workflows, the contract script
# CI runs against a build tree, and the Claude Code plugin, which is installed
# from the repository rather than from the registry. All of them live in the
# repository, which `repository` above points at.
exclude = ["/.github/", "/scripts/", "/.claude-plugin/", "/skills/"]

[[bin]]
name = "computer-use-hyprland"
path = "src/main.rs"

# One decision per group, made once. `priority = -1` is what lets an
# individual lint below override the level set for the group it belongs to.
[lints.rust]
# Not `unsafe_code`. Talking to uinput, flock and libc is this program's job,
# and a warning every one of those sites has to silence teaches nobody
# anything. Edition 2024 already asks for the keyword at each call, and
# `unsafe_op_in_unsafe_fn` is on by default in it.
missing_debug_implementations = "warn"
missing_docs = "warn"
ambiguous_negative_literals = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
# Enabled whole rather than cherry-picked, because cherry-picking means never
# seeing the pedantic lints added in a later release. The two below are the
# ones almost everybody turns back off; disagree with another by adding it
# beside them, with the reason.
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
# Every float here is a scale or a coordinate ratio, and losing precision on
# the way to one is the arithmetic, not a mistake.
cast_precision_loss = "allow"
# Individually chosen from `restriction` and `nursery`, which are menus rather
# than groups and must never be enabled wholesale.
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
missing_assert_message = "warn"
# One module layout, picked here so the next multi-file module cannot pick the
# other one: `foo.rs` beside `foo/`, which names the module in the file tree as
# well as in the source.
mod_module_files = "warn"
redundant_test_prefix = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
verbose_file_reads = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"
invalid_html_tags = "warn"
unescaped_backticks = "warn"

[dependencies]
mimalloc = { version = "0.1.52", default-features = false }
anyhow = "1.0.104"
# atspi without its "connection" feature: that feature pulls atspi-connection
# with default features, which include "p2p" — and p2p peer enumeration during
# connect() calls GetInterfaces on every a11y-bus peer, so a single
# AppArmor-confined peer (e.g. snap-packaged Slack) aborts the whole
# AccessibilityConnection. We deliberately never use P2P routing,
# so depend on atspi-connection directly with p2p off.
atspi = { version = "0.30.0", default-features = false, features = [
    "proxies",
    "wrappers",
    "tokio",
] }
atspi-connection = { version = "0.14.0", default-features = false, features = [
    "wrappers",
] }
base64 = "0.23.1"
evdev = "0.13.2"
futures-util = "0.3.34"
getrandom = "0.4.3"
image = { version = "0.25.10", default-features = false, features = [
    "jpeg",
    "png",
] }
libc = "0.2.189"
rmcp = { version = "3.2.0", features = ["transport-io"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = [
    "io-util",
    "macros",
    "process",
    "rt",
    "sync",
    "time",
] }
zbus = "5.19.0"

[dev-dependencies]
# `start_paused` in the session-lock tests, so an idle window of thirty
# seconds is crossed by moving the clock rather than waiting for it.
tokio = { version = "1.53.1", features = ["test-util"] }

# Dependencies dominate a debug build's runtime here — image decoding, PNG
# encoding, the base64 of a screenshot — and they rarely change.

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = "line-tables-only"
# Keeps the symbol table, so a backtrace out of an input path still names
# functions. `strip = "symbols"` would take that away for a few hundred KiB.
strip = "debuginfo"
# Silent wraparound becomes a panic. Every coordinate here is arithmetic over
# numbers a compositor supplied, and a wrong pixel is worse than a crash.
overflow-checks = true

# The artifact actually shipped, built by hand from a tag. Slow on purpose:
# fat LTO with one codegen unit multiplies link time, which is a bad trade on
# every developer build and a good one on the binary that goes out.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
